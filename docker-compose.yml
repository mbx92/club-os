services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: club-os-backend:latest
    restart: unless-stopped
    environment:
      TZ: Asia/Makassar
      NODE_ENV: production
      PORT: 3000
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-5433}
      DB_NAME: ${DB_NAME:-gym_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      DB_DIALECT: ${DB_DIALECT:-postgres}
      JWT_SECRET: ${JWT_SECRET:-change-me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-2h}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:-change-me}
      REFRESH_TOKEN_EXPIRES_IN: ${REFRESH_TOKEN_EXPIRES_IN:-7d}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8081,http://127.0.0.1:8081}
      # Allow LAN/on-prem origins like http://192.168.x.x:8081 in production.
      # Set to "false" for public cloud deployments that only use explicit ALLOWED_ORIGINS.
      CORS_ALLOW_PRIVATE_NETWORK: ${CORS_ALLOW_PRIVATE_NETWORK:-true}
      WAIT_FOR_DB: ${WAIT_FOR_DB:-true}
      DB_WAIT_TIMEOUT: ${DB_WAIT_TIMEOUT:-120}
      DB_WAIT_INTERVAL: ${DB_WAIT_INTERVAL:-3}
      MIGRATE_ON_START: ${MIGRATE_ON_START:-true}
      SEED_ON_START: ${SEED_ON_START:-false}
      # Google Drive backup (credentials from host .env — folder/enabled can also come from tenant settings)
      GOOGLE_DRIVE_BACKUP_ENABLED: ${GOOGLE_DRIVE_BACKUP_ENABLED:-false}
      GOOGLE_DRIVE_BACKUP_REQUIRED: ${GOOGLE_DRIVE_BACKUP_REQUIRED:-false}
      GOOGLE_DRIVE_BACKUP_FOLDER_ID: ${GOOGLE_DRIVE_BACKUP_FOLDER_ID:-}
      GOOGLE_DRIVE_BACKUP_FOLDER_URL: ${GOOGLE_DRIVE_BACKUP_FOLDER_URL:-}
      GOOGLE_DRIVE_OAUTH_CLIENT_ID: ${GOOGLE_DRIVE_OAUTH_CLIENT_ID:-}
      GOOGLE_DRIVE_OAUTH_CLIENT_SECRET: ${GOOGLE_DRIVE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_DRIVE_OAUTH_REFRESH_TOKEN: ${GOOGLE_DRIVE_OAUTH_REFRESH_TOKEN:-}
      GOOGLE_DRIVE_OAUTH_REDIRECT_URI: ${GOOGLE_DRIVE_OAUTH_REDIRECT_URI:-http://127.0.0.1:8787/oauth2callback}
      GOOGLE_DRIVE_SERVICE_ACCOUNT_KEY_FILE: ${GOOGLE_DRIVE_SERVICE_ACCOUNT_KEY_FILE:-}
      GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON: ${GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON:-}
      GOOGLE_DRIVE_SERVICE_ACCOUNT_EMAIL: ${GOOGLE_DRIVE_SERVICE_ACCOUNT_EMAIL:-}
      GOOGLE_DRIVE_SERVICE_ACCOUNT_PRIVATE_KEY: ${GOOGLE_DRIVE_SERVICE_ACCOUNT_PRIVATE_KEY:-}
      # MinIO / S3-compatible backup
      MINIO_BACKUP_ENABLED: ${MINIO_BACKUP_ENABLED:-false}
      MINIO_BACKUP_REQUIRED: ${MINIO_BACKUP_REQUIRED:-false}
      MINIO_BACKUP_ENDPOINT: ${MINIO_BACKUP_ENDPOINT:-}
      MINIO_BACKUP_REGION: ${MINIO_BACKUP_REGION:-us-east-1}
      MINIO_BACKUP_BUCKET: ${MINIO_BACKUP_BUCKET:-}
      MINIO_BACKUP_ACCESS_KEY: ${MINIO_BACKUP_ACCESS_KEY:-}
      MINIO_BACKUP_SECRET_KEY: ${MINIO_BACKUP_SECRET_KEY:-}
      MINIO_BACKUP_OBJECT_PREFIX: ${MINIO_BACKUP_OBJECT_PREFIX:-}
      MINIO_BACKUP_FORCE_PATH_STYLE: ${MINIO_BACKUP_FORCE_PATH_STYLE:-true}
      MINIO_BACKUP_USE_SSL: ${MINIO_BACKUP_USE_SSL:-false}
      BACKUP_STORAGE_DIR: ${BACKUP_STORAGE_DIR:-/app/backups}
      # Optional: pin auto-backup settings to a specific tenant
      AUTO_BACKUP_TENANT_ID: ${AUTO_BACKUP_TENANT_ID:-}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-}
      FRONTEND_URL: ${FRONTEND_URL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${BACKEND_PORT:-3001}:3000"
    volumes:
      - backend_backups:/app/backups
      - backend_uploads:/app/packages/backend/uploads
      - backend_logs:/app/packages/backend/logs
      # Service account JSON (gitignored) — mount from host when using GOOGLE_DRIVE_SERVICE_ACCOUNT_KEY_FILE
      - ${GOOGLE_DRIVE_SECRETS_DIR:-./packages/backend/src/secrets}:/app/packages/backend/src/secrets:ro

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
        VITE_APP_TITLE: ${VITE_APP_TITLE:-Club OS}
    image: club-os-frontend:latest
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8081}:80"

volumes:
  backend_backups:
  backend_uploads:
  backend_logs:
